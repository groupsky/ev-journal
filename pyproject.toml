[project]
name = "ev-journal"
version = "0.1.0"
description = "Trips, journeys and outings from the car data of the home automation stack"
requires-python = ">=3.12"
dependencies = [
  "paho-mqtt>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "holidays>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "jsonschema>=4.18"]

[project.scripts]
ev-journal = "ev_journal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
