[project]
name = "ev-journal"
version = "0.1.0"
description = "Trips, journeys and outings from the car data of the home automation stack"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ev-journal = "ev_journal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
