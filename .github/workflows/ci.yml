name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      influxdb:
        # The same major version as on the home server, with a WRITE-only and a READ-only user.
        image: influxdb:1.12.4
        ports: ["8086:8086"]
        env:
          INFLUXDB_HTTP_AUTH_ENABLED: "true"
          INFLUXDB_DB: t
          INFLUXDB_ADMIN_USER: adm
          INFLUXDB_ADMIN_PASSWORD: adm
          INFLUXDB_WRITE_USER: w
          INFLUXDB_WRITE_USER_PASSWORD: w
          INFLUXDB_READ_USER: r
          INFLUXDB_READ_USER_PASSWORD: r
    env:
      EVJ_TEST_INFLUX_URL: http://localhost:8086
      EVJ_TEST_INFLUX_DB: t
      EVJ_TEST_WRITE: "w:w"
      EVJ_TEST_READ: "r:r"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: |
          # Wait for the real server (with auth), not the setup one.
          for i in $(seq 60); do
            curl -sf -u r:r 'http://localhost:8086/query?q=SHOW+DATABASES' && exit 0
            sleep 1
          done
          exit 1
      - run: pytest -v -rs

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
